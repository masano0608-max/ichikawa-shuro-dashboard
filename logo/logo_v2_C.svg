<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="circGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#40916C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="white"/>

  <g transform="translate(200,150)">
    <!-- Main circle -->
    <circle cx="0" cy="0" r="85" fill="url(#circGrad)"/>

    <!-- Inner decorative arc -->
    <path d="M-60,-55 A80,80 0 0,1 60,-55" stroke="white" stroke-width="1" fill="none" opacity="0.2"/>
    <path d="M-50,-62 A85,85 0 0,1 50,-62" stroke="white" stroke-width="0.5" fill="none" opacity="0.15"/>

    <!-- Footstep path (abstract, 3 steps going up-right) -->
    <g fill="white" opacity="0.9">
      <!-- Step 1 (bottom left) -->
      <ellipse cx="-28" cy="35" rx="8" ry="12" transform="rotate(-20,-28,35)"/>
      <ellipse cx="-35" cy="22" rx="3" ry="4" transform="rotate(-20,-35,22)"/>
      <ellipse cx="-30" cy="18" rx="2.5" ry="3.5" transform="rotate(-10,-30,18)"/>
    </g>
    <g fill="white" opacity="0.6">
      <!-- Step 2 (middle) -->
      <ellipse cx="-5" cy="8" rx="7.5" ry="11" transform="rotate(-15,-5,8)"/>
      <ellipse cx="-11" cy="-4" rx="2.8" ry="3.5" transform="rotate(-15,-11,-4)"/>
      <ellipse cx="-6" cy="-7" rx="2.3" ry="3.2" transform="rotate(-8,-6,-7)"/>
    </g>
    <g fill="white" opacity="0.35">
      <!-- Step 3 (top right, fading = walking forward) -->
      <ellipse cx="20" cy="-22" rx="7" ry="10" transform="rotate(-10,20,-22)"/>
      <ellipse cx="14" cy="-33" rx="2.5" ry="3.2" transform="rotate(-10,14,-33)"/>
      <ellipse cx="19" cy="-35" rx="2.2" ry="3" transform="rotate(-5,19,-35)"/>
    </g>
  </g>

  <!-- Text -->
  <text x="200" y="290" text-anchor="middle" font-family="'Hiragino Maru Gothic Pro', 'M PLUS Rounded 1c', sans-serif" font-weight="700" font-size="50" fill="#2D6A4F" letter-spacing="10">いっぽ</text>

  <text x="200" y="330" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-weight="300" font-size="13" fill="#6B9080" letter-spacing="8">訪問看護ステーション</text>
</svg>
