<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 透過背景 -->

  <g transform="translate(200,120)">
    <!-- 茎 -->
    <path d="M0,45 C0,30 -2,10 0,-5" stroke="#2D6A4F" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- 左の葉（大きめ、丸みを持たせる） -->
    <path d="M-2,-5 Q-45,-30 -35,-65 Q-25,-85 -5,-70 Q5,-55 -2,-5Z" fill="#9DB4A0"/>
    <!-- 左の葉脈 -->
    <path d="M-2,-5 Q-20,-35 -30,-55" stroke="#2D6A4F" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M-8,-20 Q-18,-28 -25,-40" stroke="#2D6A4F" stroke-width="1" fill="none" opacity="0.2" stroke-linecap="round"/>

    <!-- 右の葉（少し小さめ、成長途中） -->
    <path d="M2,-8 Q40,-25 35,-58 Q28,-75 8,-62 Q-2,-48 2,-8Z" fill="#2D6A4F"/>
    <!-- 右の葉脈 -->
    <path d="M2,-8 Q18,-30 28,-48" stroke="#9DB4A0" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M8,-22 Q16,-30 22,-40" stroke="#9DB4A0" stroke-width="1" fill="none" opacity="0.2" stroke-linecap="round"/>

    <!-- 地面のドット（一歩ずつ） -->
    <circle cx="-15" cy="52" r="2.5" fill="#9DB4A0" opacity="0.4"/>
    <circle cx="-6" cy="49" r="3" fill="#9DB4A0" opacity="0.6"/>
    <circle cx="4" cy="47" r="3.5" fill="#2D6A4F" opacity="0.5"/>
    <circle cx="15" cy="49" r="3" fill="#9DB4A0" opacity="0.4"/>
  </g>

  <!-- いっぽ -->
  <text x="200" y="285" text-anchor="middle" font-family="'Hiragino Maru Gothic Pro', sans-serif" font-weight="700" font-size="50" fill="#2D6A4F" letter-spacing="8">いっぽ</text>

  <!-- サブテキスト -->
  <text x="200" y="323" text-anchor="middle" font-family="'Hiragino Sans', sans-serif" font-weight="300" font-size="13" fill="#6B9080" letter-spacing="6">訪問看護ステーション</text>
</svg>
