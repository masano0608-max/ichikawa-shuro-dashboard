<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>訪看ハンドブック</title>
<style id="app-css">
  :root{
    --bg:#F5F7F6; --surface:#FFFFFF; --surface2:#EEF2F0;
    --ink:#22302D; --muted:#5C6B67; --line:#DFE6E3;
    --accent:#0E7A6E; --accent-ink:#0A5C53; --accent-soft:#E2F0ED;
    --warn:#A16207; --warn-soft:#F8EFDC;
    --info:#31547E; --info-soft:#E5ECF4;
    --shadow:0 1px 2px rgba(34,48,45,.06), 0 4px 16px rgba(34,48,45,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131A18; --surface:#1B2422; --surface2:#222D2A;
      --ink:#E6ECEA; --muted:#92A19C; --line:#2B3733;
      --accent:#43B3A3; --accent-ink:#7ACDC1; --accent-soft:#173430;
      --warn:#DCA84F; --warn-soft:#312610;
      --info:#8FB0D8; --info-soft:#1D2A3A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="light"]{
    --bg:#F5F7F6; --surface:#FFFFFF; --surface2:#EEF2F0;
    --ink:#22302D; --muted:#5C6B67; --line:#DFE6E3;
    --accent:#0E7A6E; --accent-ink:#0A5C53; --accent-soft:#E2F0ED;
    --warn:#A16207; --warn-soft:#F8EFDC;
    --info:#31547E; --info-soft:#E5ECF4;
    --shadow:0 1px 2px rgba(34,48,45,.06), 0 4px 16px rgba(34,48,45,.06);
  }
  :root[data-theme="dark"]{
    --bg:#131A18; --surface:#1B2422; --surface2:#222D2A;
    --ink:#E6ECEA; --muted:#92A19C; --line:#2B3733;
    --accent:#43B3A3; --accent-ink:#7ACDC1; --accent-soft:#173430;
    --warn:#DCA84F; --warn-soft:#312610;
    --info:#8FB0D8; --info-soft:#1D2A3A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
    font-size:15px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}

  /* ---------- header ---------- */
  header.app{
    position:sticky; top:0; z-index:20;
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:0 20px;
  }
  .hd-inner{max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:14px; height:58px;}
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;}
  .brand-mark{
    width:30px;height:30px;border-radius:8px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none;
  }
  .brand h1{font-size:16px; font-weight:700; margin:0; letter-spacing:.02em;}
  .brand .sub{font-size:11px; color:var(--muted); letter-spacing:.08em; display:block; line-height:1.2;}
  .hd-spacer{flex:1}
  .btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:8px; padding:7px 14px; font-size:13.5px; cursor:pointer;
  }
  .btn:hover{background:var(--surface2)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink);}
  .btn:focus-visible, .card:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ---------- layout ---------- */
  .wrap{max-width:1080px; margin:0 auto; padding:22px 20px 80px;}
  .layout{display:grid; grid-template-columns:210px 1fr; gap:26px;}
  @media (max-width:760px){ .layout{grid-template-columns:1fr; gap:14px;} }

  /* ---------- sidebar ---------- */
  nav.cats{display:flex; flex-direction:column; gap:4px; align-self:start; position:sticky; top:78px;}
  @media (max-width:760px){
    nav.cats{flex-direction:row; overflow-x:auto; position:static; padding-bottom:4px;}
  }
  .cat-btn{
    display:flex; align-items:center; gap:8px; text-align:left;
    border:none; background:none; color:var(--muted);
    padding:9px 12px; border-radius:8px; font-size:14px; cursor:pointer; white-space:nowrap;
  }
  .cat-btn:hover{background:var(--surface2); color:var(--ink);}
  .cat-btn.on{background:var(--accent-soft); color:var(--accent-ink); font-weight:700;}
  .cat-btn .n{
    margin-left:auto; font-size:11.5px; background:var(--surface2); color:var(--muted);
    border-radius:99px; padding:1px 8px; font-variant-numeric:tabular-nums;
  }
  .cat-btn.on .n{background:var(--surface); color:var(--accent-ink);}

  /* ---------- doc list ---------- */
  .searchbar{margin-bottom:16px; display:flex; gap:10px;}
  .searchbar input{
    flex:1; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:9px; padding:9px 14px; font-size:14.5px; font-family:inherit;
  }
  .searchbar input::placeholder{color:var(--muted)}
  .group-label{
    font-size:12px; letter-spacing:.14em; color:var(--muted); font-weight:700;
    margin:26px 0 10px; text-transform:uppercase;
  }
  .group-label:first-of-type{margin-top:0}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:15px 16px 13px; cursor:pointer; text-align:left; color:var(--ink);
    display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow);
    transition:border-color .15s;
  }
  .card:hover{border-color:var(--accent)}
  .card h3{margin:0; font-size:14.5px; font-weight:700; line-height:1.45;}
  .card p{margin:0; font-size:12.5px; color:var(--muted); line-height:1.55;}
  .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:auto;}
  .pill{
    font-size:10.5px; border-radius:99px; padding:2px 9px; font-weight:700; letter-spacing:.03em;
    background:var(--surface2); color:var(--muted);
  }
  .pill.ready{background:var(--accent-soft); color:var(--accent-ink);}
  .pill.planned{background:var(--warn-soft); color:var(--warn);}
  .pill.hoken{background:var(--info-soft); color:var(--info);}
  .pill.duty{background:var(--surface2); color:var(--muted);}
  .pill.guide{background:var(--info-soft); color:var(--info);}

  /* ---------- 手順フロー ---------- */
  ol.flow{margin:0; padding:0; list-style:none; counter-reset:st;}
  ol.flow li{
    counter-increment:st; position:relative;
    padding:9px 0 9px 38px; font-size:14px; border-bottom:1px dashed var(--line);
  }
  ol.flow li:last-child{border-bottom:none}
  ol.flow li::before{
    content:counter(st); position:absolute; left:0; top:10px;
    width:24px; height:24px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center; font-size:12.5px; font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- detail view ---------- */
  .backbar{margin-bottom:16px;}
  .btn.back{
    display:inline-flex; align-items:center; gap:6px; font-weight:700;
    color:var(--accent-ink); border-color:var(--line);
  }
  .detail-head{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
  .detail-head h2{margin:0; font-size:21px; font-weight:700; line-height:1.4; text-wrap:balance;}
  .detail-desc{color:var(--muted); font-size:14px; max-width:640px; margin:6px 0 20px;}
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .panel h4{
    margin:0 0 10px; font-size:12px; letter-spacing:.14em; color:var(--muted); font-weight:700;
  }
  ul.items{margin:0; padding:0 0 0 2px; list-style:none;}
  ul.items li{
    padding:6px 0 6px 24px; position:relative; font-size:14px; border-bottom:1px dashed var(--line);
  }
  ul.items li:last-child{border-bottom:none}
  ul.items li::before{
    content:""; position:absolute; left:2px; top:13px;
    width:7px; height:7px; border-radius:2px; background:var(--accent);
  }
  .note{
    background:var(--warn-soft); border-radius:10px; padding:12px 15px;
    font-size:13.5px; color:var(--ink); line-height:1.7;
  }
  .note b{color:var(--warn)}
  .planned-box{
    border:1.5px dashed var(--line); border-radius:12px; padding:20px;
    text-align:center; color:var(--muted); font-size:13.5px;
  }
  .lockbox{
    background:var(--surface); border:1.5px dashed var(--line); border-radius:12px;
    padding:26px 20px; text-align:center;
  }
  .lockbox input{
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:8px; padding:8px 12px; font-size:14px; font-family:inherit; width:180px;
  }

  /* ---------- form ---------- */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr;} }
  .fld{display:flex; flex-direction:column; gap:4px;}
  .fld.full{grid-column:1 / -1;}
  .fld label{font-size:12.5px; font-weight:700; color:var(--muted);}
  .fld input, .fld textarea, .fld select{
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:8px; padding:8px 11px; font-size:14px; font-family:inherit; line-height:1.6;
  }
  .fld textarea{resize:vertical; min-height:64px;}
  .preset-pick{
    border:1px solid var(--accent) !important; background:var(--accent-soft) !important;
    color:var(--accent-ink) !important; font-weight:600; cursor:pointer; margin-bottom:2px;
  }
  .form-actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center;}
  .saved-note{font-size:12.5px; color:var(--accent-ink);}

  /* ---------- settings dialog ---------- */
  dialog{
    border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink);
    padding:24px; width:min(560px, 92vw); box-shadow:var(--shadow);
  }
  dialog::backdrop{background:rgba(15,25,22,.45)}
  dialog h3{margin:0 0 4px; font-size:17px;}
  dialog .dlg-sub{font-size:13px; color:var(--muted); margin:0 0 16px;}

  /* ---------- print sheet ---------- */
  #print-area{display:none;}
  @media print{
    body > *:not(#print-area){display:none !important;}
    #print-area{display:block;}
    body{background:#fff; color:#000;}
  }
  .sheet{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    color:#000; background:#fff; font-size:10.5pt; line-height:1.8;
    max-width:180mm; margin:0 auto; padding:10mm 0;
  }
  .sheet h1{font-size:15pt; text-align:center; letter-spacing:.3em; margin:0 0 8mm; font-weight:700;}
  .sheet table{width:100%; border-collapse:collapse; margin:4mm 0;}
  .sheet th,.sheet td{border:1px solid #000; padding:2mm 3mm; font-size:10pt; text-align:left; vertical-align:top;}
  .sheet th{width:34mm; font-weight:600; background:#f2f2f2;}
  .sheet .stamp{margin-top:10mm; display:flex; justify-content:flex-end; gap:12mm;}
  .sheet .sig{min-width:60mm;}
  .sheet .sig .line{border-bottom:1px solid #000; padding:1mm 2mm 1mm 0; margin-top:4mm;}
  .sheet p{margin:0 0 3mm;}
  .sheet ol{padding-left:6mm; margin:2mm 0;}
  .sheet ol li{margin-bottom:1.5mm;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>

<header class="app">
  <div class="hd-inner">
    <div class="brand" onclick="go('home')" tabindex="0" role="button" aria-label="ホームへ">
      <div class="brand-mark">看</div>
      <div>
        <h1>訪看ハンドブック</h1>
        <span class="sub">訪問看護の手順と書類</span>
      </div>
    </div>
    <div class="hd-spacer"></div>
    <button class="btn" onclick="openSettings()">⚙ 事業所情報</button>
  </div>
</header>

<div class="wrap" id="app"></div>

<dialog id="dlg-settings">
  <h3>事業所情報</h3>
  <p class="dlg-sub">ここで登録した内容は、すべてのテンプレートに自動で差し込まれます（この端末に保存されます）。</p>
  <div class="form-grid">
    <div class="fld full"><label>事業所名</label><input id="st-name" placeholder="訪問看護ステーション○○"></div>
    <div class="fld full"><label>所在地</label><input id="st-addr" placeholder="○○県○○市…"></div>
    <div class="fld"><label>電話番号</label><input id="st-tel" placeholder="000-000-0000"></div>
    <div class="fld"><label>FAX</label><input id="st-fax" placeholder="000-000-0000"></div>
    <div class="fld"><label>管理者氏名</label><input id="st-kanri" placeholder="看護 花子"></div>
    <div class="fld"><label>24時間連絡先（オンコール）</label><input id="st-oncall" placeholder="000-0000-0000"></div>
  </div>
  <div class="form-actions">
    <button class="btn primary" onclick="saveSettings()">保存する</button>
    <button class="btn" onclick="document.getElementById('dlg-settings').close()">閉じる</button>
  </div>
</dialog>

<div id="print-area"></div>

<script>
/* ================= data ================= */
const CATS = [
  {id:'keiyaku', name:'契約するとき', icon:'✎'},
  {id:'houmon',  name:'通常対応（訪問時）', icon:'☀'},
  {id:'senmon',  name:'専門ケア別対応', icon:'✚'},
  {id:'irreg',   name:'イレギュラー対応', icon:'⚠'},
  {id:'seibi',   name:'規程・研修の整備', icon:'⚑'},
  {id:'tsujo',   name:'人事・労務 🔒', icon:'👥', locked:true},
];

const DOCS = [
  /* ---- 契約するとき ---- */
  {id:'keiyaku-flow', cat:'keiyaku', name:'契約時の流れ（手順ガイド）', status:'guide',
   tags:['マニュアル'],
   desc:'新規の利用者さんと契約するときの一連の流れ。契約書・同意書などの帳票はカイポケのものを使用します。',
   flow:['主治医へ訪問看護指示書を依頼し、受領する（指示書が届く前にサービスを開始しない）','重要事項説明書（カイポケの帳票）を使って、サービス内容・料金・緊急時対応を説明する','利用契約書を取り交わす（利用者または代理人が署名。代理人は続柄も記載）','個人情報使用同意書に署名をもらう','オンコール（24時間対応）を利用する場合は、緊急時訪問看護の同意を個別の書面でもらう（重要事項説明書に埋め込まず独立した1枚にするのが安全）','保険証・受給者証を確認し、カイポケに登録する','ケアマネジャー・主治医へ契約完了を連絡し、初回訪問の日程を決める'],
   items:['訪問看護指示書（主治医発行）','契約書・重要事項説明書・各同意書（カイポケの帳票を使用）','保険証・受給者証（確認してカイポケへ登録）'],
   note:'契約関係書類は利用終了後も保存義務がある（介護保険は完結の日から2年、自治体により5年の場合あり）。'},

  /* ---- 通常対応（訪問時のふだんの対応） ---- */
  {id:'ichinichi', cat:'houmon', name:'出勤から退勤まで（1日の流れ）', status:'guide',
   tags:['マニュアル'],
   desc:'1日の仕事の全体像。訪問1件ごとの動きは「訪問当日の流れ」を参照。',
   flow:['出勤・体調チェック（発熱・症状があるときは出勤前に管理者へ連絡して指示を受ける）','朝礼・申し送りで当日の訪問予定と利用者さんの変化を共有する','訪問準備（バッグ点検・指示内容/計画の確認・移動ルート確認）','訪問へ（1件ごとの流れは「訪問当日の流れ」参照。件と件の間で手指衛生）','昼休憩はしっかり取る（移動しながらの「ながら休憩」にしない）','帰所後：記録・報告を済ませ、翌日の準備と物品補充をする','退勤前：管理者・オンコール当番への申し送りを済ませてから帰る'],
   items:['訪問予定表','申し送りノート・事業所内チャット','携行品チェックリスト'],
   note:'直行直帰する場合の連絡ルール（誰に・いつ・何を）は事業所の取り決めに従う。'},
  {id:'houmon-flow', cat:'houmon', name:'訪問当日の流れ（基本の型）', status:'guide',
   tags:['マニュアル'],
   desc:'ふだんの訪問1件の流れ。出発前の準備から帰所後の記録までの基本の型。',
   flow:['出発前：当日の訪問予定・前回の記録・計画の内容を確認し、必要物品を訪問バッグに準備する','時間どおりに訪問する（遅れそうな場合は5分でも必ず事前に電話連絡）','挨拶をして入室し、手指衛生を行う','バイタルサイン測定と全身状態の観察、前回からの変化・生活状況の聞き取りを行う','計画書に沿った看護・リハビリを実施する（状態に応じて内容を調整）','本人・家族に実施内容と次回予定を伝え、片付け・手指衛生をして退出する','帰所後：記録をその日のうちに記載し、気になる点は管理者へ報告する'],
   items:['訪問予定表','訪問バッグ（携行品チェックリスト参照）','記録様式・電子カルテ端末','連絡先リスト'],
   note:'「いつもと違う」と感じたら、小さなことでも記録に残して報告する。'},
  {id:'manner', cat:'houmon', name:'訪問時の接遇・マナー', status:'guide',
   tags:['マニュアル'],
   desc:'他人の家に上がる仕事だからこそのマナー。技術と同じくらい信頼をつくる基本。',
   flow:['身だしなみを整える（名札・清潔なユニフォーム・爪・髪・においに注意）','遅れそうなときは必ず事前に電話を入れる','玄関では明るく挨拶し、靴を揃える。荷物は指定の場所以外に置かない','居宅内の物に勝手に触れない。借りるとき・使うときは必ず一声かける','言葉づかいは丁寧に。子ども扱いする言葉（「〜でちゅね」等）は使わない','個人的な話題や他の利用者の話はしない（守秘義務）','帰り際に次回訪問日を伝え、玄関で挨拶して退出する'],
   items:['名札・身分証','事業所の接遇ルール'],
   note:'クレームの多くはケア内容ではなく接遇から生まれる。迷ったら「自分の家族の家」と同じ振る舞いを。'},
  {id:'kansatsu', cat:'houmon', name:'状態観察と報告の基準', status:'guide',
   tags:['マニュアル'], itemsTitle:'毎回の観察項目',
   desc:'訪問ごとに確認する観察項目と、「報告するかどうか」の判断基準。',
   flow:['利用者ごとの「いつもの状態（ベースライン）」を把握しておく','訪問ごとに観察項目を確認し、記録する','「いつもと違う」があれば、程度にかかわらず管理者に報告する','明らかな異常（呼吸苦・意識レベル低下・強い痛み・急な発熱など）は、その場で管理者または主治医へ連絡して指示を受ける','緊急性が高い場合は救急要請をためらわない（イレギュラー対応「緊急時フロー」参照）'],
   items:['バイタルサイン（体温・脈拍・血圧・呼吸・SpO2）','意識状態・表情・会話の様子','皮膚の状態（褥瘡・浮腫・乾燥・傷）','食事・水分の摂取状況','排泄の状況（便秘・下痢・尿量）','睡眠・日中の活動の様子','内服状況（残薬の確認）','住環境・家族の介護状況の変化'],
   note:'報告に「しすぎ」はない。迷ったら報告する。'},
  {id:'hourensou', cat:'houmon', name:'報告・連絡・相談のルール', status:'guide',

          <tr><th>場所</th><td colspan="3">${esc(v.basho)}</td></tr>

/* ---- 管理者用カテゴリのロック（PWはハッシュで保持） ---- */
const LOCKS = {tsujo: '59f469ab24d0ed18279d36385fa3a6bce68b2950fd1c7b5c4e3bd9d79659c8e8'};
const LOCK_FALLBACK = {tsujo: 'aXBwbw=='};
function unlocked(catId){
  const c = CATS.find(x=>x.id===catId);
  if(!c || !c.locked) return true;
  return sessionStorage.getItem('hk-unlock-'+catId) === '1';
}
async function tryUnlock(catId){
  const el = document.getElementById('lock-pw-'+catId);
  const pw = (el && el.value || '').trim();
  let ok = false;
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
    ok = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('') === LOCKS[catId];
  }catch(e){ ok = btoa(pw) === LOCK_FALLBACK[catId]; }
  if(ok){
    sessionStorage.setItem('hk-unlock-'+catId, '1');
    render();
  } else {
    const m = document.getElementById('lock-msg-'+catId);
    if(m) m.textContent = 'パスワードが違います';
    if(el) el.value = '';
  }
}

/* ================= state & utils ================= */
let view = {name:'home', cat:'keiyaku', q:''};
const $ = id => document.getElementById(id);
const esc = s => (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') || '　　　　　　';
function jdate(iso){
  if(!iso) return '　　年　　月　　日';
  const d = new Date(iso + 'T00:00:00');
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
const escA = s => (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function getSt(){ try{ return JSON.parse(localStorage.getItem('hk-station')||'{}'); }catch(e){ return {}; } }


/* ---- 下書き（この端末に自動保存） ---- */
function draftKey(docId){ return 'hk-draft-' + docId + '::shared'; }
function getDraft(docId){ try{ return JSON.parse(localStorage.getItem(draftKey(docId))||'{}'); }catch(e){ return {}; } }

/* ---- ファイル名「記入者名_書類名_日付」 ---- */
function docFileName(docId){
  const v = collect();
  const form = FORMS[docId] || {};
  const pname = form.fnameBase ? form.fnameBase(v) : '無記名';
  const d = DOCS.find(x=>x.id===docId);
  const today = new Date().toISOString().slice(0,10);
  return (pname.replace(/\s+/g,'') + '_' + d.name.replace(/（.*?）/g,'') + '_' + today)
    .replace(/[\\\/:*?"<>|]/g, '');
}

/* ================= views ================= */
function go(name, arg, fromHistory){
  // ロック中カテゴリの書類はカテゴリ画面（パスワード入力）へ誘導
  if(name==='doc'){
    const dd = DOCS.find(x=>x.id===arg);
    if(dd && !unlocked(dd.cat)){ name='cat'; arg=dd.cat; }
  }
  if(name==='home'){ view={...view, name:'home'}; }
  if(name==='cat'){ view={...view, name:'home', cat:arg}; }
  if(name==='doc'){ view={...view, name:'doc', doc:arg}; }
  // 詳細へ進むときは履歴を積み、スマホ/ブラウザの「戻る」で一覧へ戻れるようにする
  if(!fromHistory){
    try{
      if(name==='doc'){
        // 書類→書類の移動は履歴を置き換え、常に「一覧→書類」の2階層に保つ
        if(history.state && history.state.v==='doc'){ history.replaceState({v:'doc', doc:arg}, ''); }
        else{ history.pushState({v:'doc', doc:arg}, ''); }
      }
      else if(history.state && history.state.v==='doc'){ history.back(); return; }
    }catch(e){ /* 履歴APIが使えない環境ではアプリ内ボタンのみで遷移 */ }
  }
  render();
  window.scrollTo({top:0});
}
function goBack(){
  const d = DOCS.find(x=>x.id===view.doc);
  go('cat', d ? d.cat : view.cat);
}
window.addEventListener('popstate', (e)=>{
  // 履歴に残っている書類IDが存在しない場合（書類の入れ替え後など）は一覧へ
  if(e.state && e.state.v==='doc' && DOCS.some(d=>d.id===e.state.doc)){ go('doc', e.state.doc, true); }
  else { go('cat', view.cat, true); }
});

function render(){
  const app = $('app');
  if(view.name==='doc'){
    const d = DOCS.find(x=>x.id===view.doc);
    if(!d){ view = {...view, name:'home'}; }
    else { app.innerHTML = renderDoc(d); bindForm(); return; }
  }
  app.innerHTML = renderHome();
  const s = $('search'); if(s){ s.value = view.q; }
}

function renderHome(){
  const q = view.q.trim();
  let docs = DOCS;
  if(q){ docs = DOCS.filter(d => (d.name + d.desc + d.tags.join('')).includes(q)); }
  const cats = q ? CATS : CATS.filter(c=>c.id===view.cat);
  const readyCount = DOCS.filter(d=>d.status==='ready').length;

  return `
  <div class="layout">
    <nav class="cats" aria-label="カテゴリ">
      ${CATS.map(c=>`
        <button class="cat-btn ${(!q && view.cat===c.id)?'on':''}" onclick="view.q='';go('cat','${c.id}')">
          <span>${c.icon}</span> ${c.name}
          <span class="n">${DOCS.filter(d=>d.cat===c.id).length}</span>
        </button>`).join('')}
    </nav>
    <main>
      <div class="searchbar">
        <input id="search" placeholder="検索（例：オンコール、精神科、研修、BCP）" oninput="view.q=this.value; renderList()">
      </div>
      <div id="list">${renderList(true)}</div>
      <p style="font-size:12.5px; color:var(--muted); margin-top:28px;">
        現在 <b style="color:var(--accent-ink)">${readyCount}件</b> のテンプレートが入力・印刷に対応しています。「準備中」の書類は順次テンプレートを追加していきます。
      </p>
    </main>
  </div>`;
}

function renderList(ret){
  const q = view.q.trim();
  let html = '';
  const cats = q ? CATS : CATS.filter(c=>c.id===view.cat);
  for(const c of cats){
    let docs = DOCS.filter(d=>d.cat===c.id);
    if(q) docs = docs.filter(d => (d.name + d.desc + d.tags.join('')).includes(q));
    if(!docs.length) continue;
    if(c.locked && !unlocked(c.id)){
      html += `<div class="group-label">${c.name}</div>
        <div class="lockbox">
          <div style="font-size:15px; font-weight:700">🔒 このカテゴリは管理者用です</div>
          <div style="font-size:13px; color:var(--muted); margin:4px 0 12px">パスワードを入力してください</div>
          <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap">
            <input type="password" id="lock-pw-${c.id}" placeholder="パスワード" autocomplete="off"
              onkeydown="if(event.key==='Enter')tryUnlock('${c.id}')">
            <button class="btn primary" onclick="tryUnlock('${c.id}')">開く</button>
          </div>
          <div id="lock-msg-${c.id}" style="font-size:12.5px; color:var(--warn); margin-top:8px; min-height:1.2em"></div>
        </div>`;
      continue;
    }
    html += `<div class="group-label">${c.name}</div>
      <div class="cards">
        ${docs.map(d=>`
          <button class="card" onclick="go('doc','${d.id}')">
            <h3>${d.name}</h3>
            <p>${d.desc}</p>
            <div class="tags">
              ${d.status==='ready' ? '<span class="pill ready">✓ 入力・印刷OK</span>' : d.status==='guide' ? '<span class="pill guide">📖 手順ガイド</span>' : '<span class="pill planned">準備中</span>'}
              ${d.tags.map(t=>`<span class="pill ${/保険/.test(t)?'hoken':'duty'}">${t}</span>`).join('')}
            </div>
          </button>`).join('')}
      </div>`;
  }
  if(!html) html = `<div class="planned-box">「${esc(q)}」に一致する書類はありません</div>`;
  if(ret) return html;
  const el = $('list');
  if(el) el.innerHTML = html;
}

function renderDoc(d){
  const cat = CATS.find(c=>c.id===d.cat);
  const form = FORMS[d.id];
  return `
    <div class="backbar"><button class="btn back" onclick="goBack()">← ${cat.name}の一覧に戻る</button></div>
    <div class="detail-head">
      <h2>${d.name}</h2>
      ${d.status==='ready' ? '<span class="pill ready" style="margin-top:6px">✓ 入力・印刷OK</span>' : d.status==='guide' ? '<span class="pill guide" style="margin-top:6px">📖 手順ガイド</span>' : '<span class="pill planned" style="margin-top:6px">テンプレ準備中</span>'}
    </div>
    <p class="detail-desc">${d.desc}</p>

    ${d.flow ? `
    <div class="panel">
      <h4>対応の流れ</h4>
      <ol class="flow">${d.flow.map(s=>`<li>${s}</li>`).join('')}</ol>
    </div>` : ''}
    <div class="panel">
      <h4>${d.itemsTitle || (d.flow ? '使う書類・備えておくもの' : 'この書類に必要な項目')}</h4>
      <ul class="items">${d.items.map(i=>`<li>${i}</li>`).join('')}</ul>
    </div>
    ${d.note ? `<div class="note" style="margin-bottom:16px">${d.note}</div>` : ''}

    ${form ? `
    <div class="panel">
      <h4>テンプレートに入力する</h4>
      <div class="form-grid" oninput="autoSave('${d.id}')">
        ${form.fields.map(f=>{
          const full = f.full || f.t==='textarea' ? 'full' : '';
          if(f.t==='select') return `<div class="fld ${full}"><label>${f.l}</label><select data-k="${f.k}"><option value=""></option>${f.opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
          if(f.t==='textarea'){
            const ps = fieldPresets(f);
            const picker = ps ? `<select class="preset-pick" onchange="insertPreset(this,'${d.id}','${f.k}')">
              <option value="">＋ 定型文から選んで挿入（選択後も編集できます）</option>
              ${ps.map((p,i)=>`<option value="${i}">${p.label}</option>`).join('')}
            </select>` : '';
            return `<div class="fld full"><label>${f.l}</label>${picker}<textarea data-k="${f.k}" placeholder="${f.ph||''}"></textarea></div>`;
          }
          return `<div class="fld ${full}"><label>${f.l}</label><input type="${f.t}" data-k="${f.k}" placeholder="${f.ph||''}"></div>`;
        }).join('')}
      </div>
      <div class="form-actions">
        <button class="btn primary" onclick="printDoc('${d.id}')">🖨 印刷 / PDF保存</button>
        <button class="btn" onclick="saveFile('${d.id}')">💾 ファイルに保存</button>
        <button class="btn" onclick="clearDraft('${d.id}')">クリア</button>
        <span class="saved-note" id="save-note"></span>
      </div>
    </div>
    <p style="font-size:12px; color:var(--muted)">※ ファイル名は「記入者名_書類名_日付」で自動設定されます。PDF保存・ファイル保存のとき、保存先にGoogle Driveのフォルダを選べばそのままDriveに格納できます。入力内容はこの端末にのみ保存されます。</p>
    ` : d.status==='guide' ? '' : `
    <div class="planned-box">
      この書類のテンプレートは準備中です。<br>上の「必要な項目」を参考に、既存の様式をご利用ください。順次このツールに追加していきます。
    </div>`}
  `;
}

/* ================= form logic ================= */
function bindForm(){
  const d = DOCS.find(x=>x.id===view.doc);
  if(!FORMS[d.id]) return;
  const draft = getDraft(d.id);
  document.querySelectorAll('[data-k]').forEach(el=>{
    if(draft[el.dataset.k]) el.value = draft[el.dataset.k];
  });
}
let autoSaveTimer = 0;
function autoSave(docId){
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(()=>{
    localStorage.setItem(draftKey(docId), JSON.stringify(collect()));
    const n = $('save-note');
    if(n){ n.textContent = '✓ 自動保存しました'; setTimeout(()=>{ if(n) n.textContent=''; }, 1500); }
  }, 600);
}
function insertPreset(sel, docId, key){
  const i = sel.value;
  sel.value = '';
  if(i === '') return;
  const f = FORMS[docId].fields.find(x=>x.k===key);
  const text = fieldPresets(f)[i].text;
  const ta = document.querySelector(`textarea[data-k="${key}"]`);
  // 既に入力があれば消さずに改行して追記する
  ta.value = ta.value.trim() ? ta.value.replace(/\s+$/,'') + '\n\n' + text : text;
  ta.focus();
}
function collect(){
  const v = {};
  document.querySelectorAll('[data-k]').forEach(el=>{ v[el.dataset.k] = el.value; });
  return v;
}
function clearDraft(id){
  localStorage.removeItem(draftKey(id));
  document.querySelectorAll('[data-k]').forEach(el=>{ el.value=''; });
}
function printDoc(id){
  const st = getSt();
  $('print-area').innerHTML = FORMS[id].render(collect(), st);
  // 「PDFとして保存」のファイル名は文書タイトルが使われるため、記入者名_書類名_日付をセットする
  const orig = document.title;
  document.title = docFileName(id);
  window.print();
  setTimeout(()=>{ document.title = orig; }, 1000);
}
function sheetFileHtml(id){
  const st = getSt();
  const css = document.getElementById('app-css').textContent;
  return '<!doctype html><html><head><meta charset="utf-8"><title>' + escA(docFileName(id)) + '</title>'
    + '<style>' + css + '<\/style></head><body style="background:#fff">'
    + FORMS[id].render(collect(), st) + '</body></html>';
}
async function saveFile(id){
  const fname = docFileName(id) + '.html';
  const html = sheetFileHtml(id);
  const n = $('save-note');
  const dl = (window.claude || {}).downloads;
  if(dl){
    try{
      await dl.save({filename: fname, data: html});
      if(n) n.textContent = '✓ 保存しました';
    }catch(err){
      if(err && err.code === 'declined'){ return; }
      if(err && err.code === 'rate_limited'){ if(n) n.textContent = '少し待ってからもう一度押してください'; return; }
      // html形式が使えない環境ではtxtで保存する
      try{
        await dl.save({filename: docFileName(id) + '.txt', data: html});
        if(n) n.textContent = '✓ 保存しました（.txt形式）';
      }catch(e2){ if(n) n.textContent = '保存できませんでした。「🖨 印刷 / PDF保存」をお使いください'; }
    }
    if(n) setTimeout(()=>{ if(n) n.textContent=''; }, 3000);
    return;
  }
  // ローカル利用時は通常のダウンロード
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ================= settings ================= */
const ST_KEYS = ['name','addr','tel','fax','kanri','oncall'];
function openSettings(){
  const st = getSt();
  ST_KEYS.forEach(k=>{ $('st-'+k).value = st[k]||''; });
  $('dlg-settings').showModal();
}
function saveSettings(){
  const st = {};
  ST_KEYS.forEach(k=>{ st[k] = $('st-'+k).value; });
  localStorage.setItem('hk-station', JSON.stringify(st));
  $('dlg-settings').close();
}

// 読み込み時は必ず「一覧」階層から始める（リロードで古い履歴状態が残っていても正常に戻れるように）
try{ history.replaceState(null, ''); }catch(e){}
render();
</script>
