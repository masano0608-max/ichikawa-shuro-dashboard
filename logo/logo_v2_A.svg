<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="white"/>

  <g transform="translate(200,155)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#2D6A4F" stroke-width="3"/>

    <!-- Stylized leaf path forming letter い -->
    <path d="M-30,-35 C-30,-55 -15,-65 0,-55 C10,-48 8,-30 -5,-25 C-15,-22 -25,-20 -30,-10 C-35,2 -28,15 -18,20 C-8,25 -2,22 0,15"
          stroke="#2D6A4F" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Second stroke of い -->
    <path d="M15,-30 C15,-45 20,-50 25,-42 C30,-32 28,-10 20,10 C14,25 10,35 12,42"
          stroke="#9DB4A0" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Abstract leaf accent -->
    <path d="M30,-20 C45,-35 60,-25 55,-10 C50,5 35,10 30,-5Z" fill="#2D6A4F" opacity="0.15"/>

    <!-- Small stepping dots (一歩) -->
    <circle cx="-50" cy="50" r="3" fill="#9DB4A0"/>
    <circle cx="-38" cy="42" r="4" fill="#9DB4A0" opacity="0.7"/>
    <circle cx="-25" cy="36" r="5" fill="#2D6A4F" opacity="0.5"/>
  </g>

  <!-- Text: いっぽ -->
  <text x="200" y="295" text-anchor="middle" font-family="'Hiragino Maru Gothic Pro', 'M PLUS Rounded 1c', sans-serif" font-weight="700" font-size="48" fill="#2D6A4F" letter-spacing="8">いっぽ</text>

  <!-- Subtext -->
  <text x="200" y="335" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-weight="300" font-size="14" fill="#6B9080" letter-spacing="6">訪問看護ステーション</text>
</svg>
