<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 透過背景 -->

  <g transform="translate(200,125)">
    <!-- 左の人（丸+体のみ） -->
    <circle cx="-18" cy="-18" r="12" fill="#2D6A4F"/>
    <path d="M-18,-6 C-18,-6 -30,2 -30,16 C-30,24 -26,28 -18,28" fill="none" stroke="#2D6A4F" stroke-width="5" stroke-linecap="round"/>

    <!-- 右の人 -->
    <circle cx="18" cy="-18" r="12" fill="#9DB4A0"/>
    <path d="M18,-6 C18,-6 30,2 30,16 C30,24 26,28 18,28" fill="none" stroke="#9DB4A0" stroke-width="5" stroke-linecap="round"/>

    <!-- 手をつなぐ（アーチ） -->
    <path d="M-12,12 C-5,20 5,20 12,12" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- いっぽ -->
  <text x="200" y="275" text-anchor="middle" font-family="'Hiragino Maru Gothic Pro', sans-serif" font-weight="700" font-size="50" fill="#2D6A4F" letter-spacing="8">いっぽ</text>

  <text x="200" y="313" text-anchor="middle" font-family="'Hiragino Sans', sans-serif" font-weight="300" font-size="13" fill="#6B9080" letter-spacing="6">訪問看護ステーション</text>
</svg>
