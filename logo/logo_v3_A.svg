<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 透過背景 -->

  <g transform="translate(200,120)">
    <!-- 左の人 -->
    <circle cx="-25" cy="-28" r="13" fill="#2D6A4F"/>
    <rect x="-36" y="-12" width="22" height="30" rx="8" fill="#9DB4A0"/>
    <!-- 左の足 -->
    <rect x="-33" y="20" width="7" height="16" rx="3.5" fill="#2D6A4F" opacity="0.5"/>
    <rect x="-24" y="20" width="7" height="16" rx="3.5" fill="#2D6A4F" opacity="0.5"/>

    <!-- 右の人 -->
    <circle cx="25" cy="-28" r="13" fill="#2D6A4F"/>
    <rect x="14" y="-12" width="22" height="30" rx="8" fill="#2D6A4F"/>
    <!-- 右の足 -->
    <rect x="17" y="20" width="7" height="16" rx="3.5" fill="#9DB4A0" opacity="0.5"/>
    <rect x="26" y="20" width="7" height="16" rx="3.5" fill="#9DB4A0" opacity="0.5"/>

    <!-- 手をつなぐ -->
    <path d="M-14,5 C-7,12 7,12 14,5" stroke="#2D6A4F" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- 小さなハート（手の上） -->
    <path d="M0,-2 C-1.5,-6 -6,-7 -6,-4 C-6,-1.5 0,4 0,4 S6,-1.5 6,-4 C6,-7 1.5,-6 0,-2Z" fill="#e87070" opacity="0.6"/>
  </g>

  <!-- いっぽ -->
  <text x="200" y="280" text-anchor="middle" font-family="'Hiragino Maru Gothic Pro', sans-serif" font-weight="700" font-size="50" fill="#2D6A4F" letter-spacing="8">いっぽ</text>

  <!-- サブテキスト -->
  <text x="200" y="318" text-anchor="middle" font-family="'Hiragino Sans', sans-serif" font-weight="300" font-size="13" fill="#6B9080" letter-spacing="6">訪問看護ステーション</text>
</svg>
