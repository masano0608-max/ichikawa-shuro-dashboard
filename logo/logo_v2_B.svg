<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#52B788"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9DB4A0"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="white"/>

  <g transform="translate(200,135)">
    <!-- Modern geometric leaf 1 -->
    <path d="M0,-70 C30,-70 60,-45 60,-10 C60,20 35,45 0,50 C0,50 0,-10 0,-70Z" fill="url(#leafGrad)" opacity="0.9"/>

    <!-- Modern geometric leaf 2 (mirrored, lighter) -->
    <path d="M0,-60 C-25,-60 -50,-40 -50,-10 C-50,18 -30,40 0,45 C0,45 0,-10 0,-60Z" fill="url(#leafGrad2)" opacity="0.6"/>

    <!-- Center vein line -->
    <line x1="0" y1="-65" x2="0" y2="50" stroke="white" stroke-width="2" opacity="0.4"/>

    <!-- Small path dots rising up -->
    <circle cx="0" cy="60" r="3.5" fill="#2D6A4F"/>
    <circle cx="0" cy="72" r="2.5" fill="#2D6A4F" opacity="0.5"/>
    <circle cx="0" cy="81" r="1.5" fill="#2D6A4F" opacity="0.3"/>
  </g>

  <!-- Text -->
  <text x="200" y="290" text-anchor="middle" font-family="'Hiragino Maru Gothic Pro', 'M PLUS Rounded 1c', sans-serif" font-weight="700" font-size="52" fill="#2D6A4F" letter-spacing="6">いっぽ</text>

  <!-- Thin separator -->
  <line x1="155" y1="305" x2="245" y2="305" stroke="#52B788" stroke-width="1"/>

  <!-- Subtext -->
  <text x="200" y="330" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-weight="300" font-size="13" fill="#6B9080" letter-spacing="8">訪問看護ステーション</text>
</svg>
